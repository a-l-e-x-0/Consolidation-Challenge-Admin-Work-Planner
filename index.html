<!doctype html>
<html lang="sv">
  <head>
    <title>Admin Work Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Admin Work Planner</h1>
    <input id="search" type="text" placeholder="Sök task med ID" />
    <button onclick="searchTask()">Sök</button>

    <p id="searchResult"></p>

    <p>Totalt: <span id="total"></span></p>
    <p>Färdiga: <span id="done"></span></p>

    <div id="tasks"></div>

    <script src="script.js"></script>
  </body>
</html>
